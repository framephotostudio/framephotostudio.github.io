name: Model lab (open-source models for blur, cut-out and vanish)
# Downloads commercially usable open-source models (Apache 2.0 / MIT), makes phone-size versions,
# and saves them to the ci-models branch for testing. Nothing is published to users.
on:
  push:
    branches: [model-lab]
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install onnx onnxruntime onnxconverter-common numpy torch --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Download
        run: |
          mkdir -p out dl
          H=https://huggingface.co
          get(){ curl -sfL -o "$2" "$1" && echo "ok $2 $(stat -c%s "$2")" || echo "FAILED $1"; }
          get $H/onnx-community/depth-anything-v2-small/resolve/main/onnx/model_quantized.onnx out/depth_small_q8.onnx
          get $H/onnx-community/depth-anything-v2-small/resolve/main/onnx/model_fp16.onnx dl/depth_small_f16.onnx
          get $H/Xenova/modnet/resolve/main/onnx/model_quantized.onnx out/modnet_q8.onnx
          get $H/Xenova/modnet/resolve/main/onnx/model.onnx dl/modnet.onnx
          get $H/onnx-community/BiRefNet_lite-ONNX/resolve/main/onnx/model_quantized.onnx dl/birefnet_lite_q8.onnx
          get $H/onnx-community/BiRefNet_lite-ONNX/resolve/main/onnx/model_fp16.onnx dl/birefnet_lite_f16.onnx
          get https://github.com/Sanster/models/releases/download/migan/migan_traced.pt dl/migan_traced.pt
          get $H/andraniksargsyan/migan/resolve/main/migan_pipeline_v2.onnx dl/migan_pipeline_v2.onnx
          for f in $H/Xenova/modnet/raw/main/README.md $H/onnx-community/depth-anything-v2-small/raw/main/README.md $H/onnx-community/BiRefNet_lite-ONNX/raw/main/README.md $H/andraniksargsyan/migan/raw/main/README.md; do echo "== $f"; curl -sfL "$f" | head -20; done
      - name: Convert
        run: |
          python - <<'PY'
          import os, torch, numpy as np
          # MI-GAN (MIT): torchscript -> onnx, 512x512, inputs image(1,3,512,512 in -1..1) + mask
          try:
              if os.path.exists('dl/migan_pipeline_v2.onnx'):
                  import shutil; shutil.copy('dl/migan_pipeline_v2.onnx','out/migan.onnx')
              else:
                  m=torch.jit.load('dl/migan_traced.pt',map_location='cpu').eval()
                  x=torch.zeros(1,4,512,512)
                  torch.onnx.export(m,x,'out/migan.onnx',opset_version=17,input_names=['input'],output_names=['output'])
          except Exception as e: print('migan failed',e)
          import shutil
          for a,b in [('dl/birefnet_lite_q8.onnx','out/birefnet_lite_q8.onnx')]:
              if os.path.exists(a) and os.path.getsize(a)<95e6: shutil.copy(a,b)
          for f in sorted(os.listdir('out')): print(f, os.path.getsize('out/'+f)/1e6,'MB')
          import onnxruntime as ort
          for f in sorted(os.listdir('out')):
              try:
                  s=ort.InferenceSession('out/'+f); print(f,[ (i.name,i.shape,i.type) for i in s.get_inputs()],[(o.name,o.shape) for o in s.get_outputs()])
              except Exception as e: print(f,'load failed',e)
          PY
      - name: Save
        run: |
          git config user.name face-couture-ci; git config user.email hello@facecouture.app
          git fetch origin ci-models && git checkout -q origin/ci-models -- out || true
          ls -la out
          git checkout --orphan ci-models2; git rm -rfq --cached .; git add -f out; git commit -qm "open-source models for testing"; git push -qf origin HEAD:ci-models
