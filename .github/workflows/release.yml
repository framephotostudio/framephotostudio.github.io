name: Release Face Couture apps
# Signed builds uploaded to TestFlight and Google Play (closed testing). Needs the secrets listed in README.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (e.g. 1.0.0)
        default: '1.0.0'
      android_track:
        description: Google Play track
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
env:
  DEPS: "@capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/ios@latest @capacitor/splash-screen@latest @capacitor/status-bar@latest @capacitor/share@latest @capacitor/filesystem@latest @capacitor/haptics@latest @capacitor/app@latest @capacitor/network@latest @capacitor/preferences@latest @capacitor/browser@latest @revenuecat/purchases-capacitor@latest"
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install $DEPS
      - run: npm install @capacitor-community/in-app-review@latest || true
      - run: npm run build:web
        env: { FC_API_URL: '${{ vars.FC_API_URL }}', FC_RC_IOS: '${{ vars.FC_RC_IOS }}', FC_RC_ANDROID: '${{ vars.FC_RC_ANDROID }}', FC_SUPPORT_EMAIL: '${{ vars.FC_SUPPORT_EMAIL }}', APP_VERSION: '${{ inputs.version }}' }
      - run: npx cap add android && bash scripts/native-setup.sh android && npx cap sync android
        env: { APP_VERSION: '${{ inputs.version }}', BUILD_NUMBER: '${{ github.run_number }}' }
      - name: Upload key (created on first run if missing)
        id: key
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload.jks
            echo "PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV; echo "ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV; echo "KPASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            PASS=$(openssl rand -hex 16); keytool -genkeypair -v -keystore upload.jks -alias facecouture -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Face Couture, O=Always Luxe, C=US"
            echo "PASS=$PASS" >> $GITHUB_ENV; echo "ALIAS=facecouture" >> $GITHUB_ENV; echo "KPASS=$PASS" >> $GITHUB_ENV
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. A new upload key was generated for this run. Save it NOW as secrets (download the 'android-upload-key' artifact): ANDROID_KEYSTORE_BASE64 = contents of upload.jks.b64, ANDROID_KEYSTORE_PASSWORD = ANDROID_KEY_PASSWORD = the password in password.txt, ANDROID_KEY_ALIAS = facecouture"
            base64 -w0 upload.jks > upload.jks.b64; echo "$PASS" > password.txt
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        with: { name: android-upload-key, path: "upload.jks.b64\npassword.txt", retention-days: 3 }
      - name: Signed release bundle (.aab)
        run: |
          cd android
          cat >> app/build.gradle <<EOF
          android { signingConfigs { release { storeFile file("${{ github.workspace }}/upload.jks"); storePassword "$PASS"; keyAlias "$ALIAS"; keyPassword "$KPASS" } }
                    buildTypes { release { signingConfig signingConfigs.release } } }
          EOF
          ./gradlew bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with: { name: face-couture-android-release, path: "android/app/build/outputs/bundle/release/*.aab\nandroid/app/build/outputs/apk/release/*.apk" }
      - name: Upload to Google Play
        if: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.facecouture.studio
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.android_track }}
          status: completed
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install $DEPS
      - run: npm install @capacitor-community/in-app-review@latest || true
      - run: npm run build:web
        env: { FC_API_URL: '${{ vars.FC_API_URL }}', FC_RC_IOS: '${{ vars.FC_RC_IOS }}', FC_RC_ANDROID: '${{ vars.FC_RC_ANDROID }}', FC_SUPPORT_EMAIL: '${{ vars.FC_SUPPORT_EMAIL }}', APP_VERSION: '${{ inputs.version }}' }
      - run: npx cap add ios && bash scripts/native-setup.sh ios && npx cap sync ios
        env: { APP_VERSION: '${{ inputs.version }}', BUILD_NUMBER: '${{ github.run_number }}' }
      - name: App Store Connect API key
        if: ${{ secrets.APPSTORE_PRIVATE_KEY != '' }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
      - name: Create distribution certificate (first run only, when none is saved yet)
        if: ${{ secrets.APPSTORE_PRIVATE_KEY != '' && secrets.IOS_DIST_CERT_P12_BASE64 == '' }}
        env: { APPSTORE_ISSUER_ID: '${{ secrets.APPSTORE_ISSUER_ID }}', APPSTORE_KEY_ID: '${{ secrets.APPSTORE_KEY_ID }}', APPSTORE_PRIVATE_KEY: '${{ secrets.APPSTORE_PRIVATE_KEY }}' }
        run: |
          node scripts/asc-cert.mjs
          echo "::warning::A new Apple Distribution certificate was created. Download the 'ios-distribution-certificate' artifact and save IOS_DIST_CERT_P12_BASE64 (dist.p12.b64) and IOS_DIST_CERT_PASSWORD (password.txt) as secrets, then re-run this workflow."
      - uses: actions/upload-artifact@v4
        if: ${{ secrets.APPSTORE_PRIVATE_KEY != '' && secrets.IOS_DIST_CERT_P12_BASE64 == '' }}
        with: { name: ios-distribution-certificate, path: "dist.p12.b64\npassword.txt", retention-days: 3 }
      - name: Distribution certificate
        if: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' }}
        run: |
          echo "${{ secrets.IOS_DIST_CERT_P12_BASE64 }}" | base64 -d > dist.p12
          security create-keychain -p ci build.keychain; security default-keychain -s build.keychain; security unlock-keychain -p ci build.keychain
          security import dist.p12 -k build.keychain -P "${{ secrets.IOS_DIST_CERT_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - name: Archive and upload to TestFlight
        if: ${{ secrets.APPSTORE_PRIVATE_KEY != '' && secrets.IOS_DIST_CERT_P12_BASE64 != '' }}
        run: |
          set -o pipefail
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos -archivePath build/App.xcarchive archive \
            -allowProvisioningUpdates -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" CODE_SIGN_STYLE=Automatic | tail -40
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string><key>destination</key><string>upload</string><key>signingStyle</key><string>automatic</string><key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string></dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/out \
            -allowProvisioningUpdates -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} | tail -40
      - name: Not configured yet
        if: ${{ secrets.APPSTORE_PRIVATE_KEY == '' || secrets.IOS_DIST_CERT_P12_BASE64 == '' }}
        run: |
          echo "::notice::iOS signing secrets are not set yet (APPSTORE_*, IOS_DIST_CERT_*, APPLE_TEAM_ID). The simulator test build still runs in 'Build Face Couture apps'. Add the secrets from README.md and re-run this workflow to upload to TestFlight."
