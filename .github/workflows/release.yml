name: Release Face Couture apps
# Signed builds uploaded to TestFlight and Google Play (closed testing). Needs the secrets listed in README.md.
on:
  # changing release/ios.txt on the mobile-app branch sends an iPhone build to TestFlight
  push:
    branches: [mobile-app]
    paths: ['release/ios.txt']
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (e.g. 1.0.0)
        default: '1.0.0'
      android_track:
        description: Google Play track
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
env:
  VERSION: ${{ inputs.version || '1.0.0' }}
  DEPS: "@capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/ios@latest @capacitor/splash-screen@latest @capacitor/status-bar@latest @capacitor/share@latest @capacitor/filesystem@latest @capacitor/haptics@latest @capacitor/app@latest @capacitor/network@latest @capacitor/preferences@latest @capacitor/browser@latest @revenuecat/purchases-capacitor@latest"
jobs:
  android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install $DEPS
      - run: npm install @capacitor-community/in-app-review@latest || true
      - run: npm run build:web
        env: { FC_API_URL: '${{ vars.FC_API_URL }}', FC_RC_IOS: '${{ vars.FC_RC_IOS }}', FC_RC_ANDROID: '${{ vars.FC_RC_ANDROID }}', FC_SUPPORT_EMAIL: '${{ vars.FC_SUPPORT_EMAIL }}', APP_VERSION: '${{ env.VERSION }}' }
      - run: npx cap add android && bash scripts/native-setup.sh android && npx cap sync android
        env: { APP_VERSION: '${{ env.VERSION }}', BUILD_NUMBER: '${{ github.run_number }}' }
      - name: Upload key (created on first run if missing)
        id: key
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload.jks
            echo "PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV; echo "ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV; echo "KPASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            PASS=$(openssl rand -hex 16); keytool -genkeypair -v -keystore upload.jks -alias facecouture -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Face Couture, O=Always Luxe, C=US"
            echo "PASS=$PASS" >> $GITHUB_ENV; echo "ALIAS=facecouture" >> $GITHUB_ENV; echo "KPASS=$PASS" >> $GITHUB_ENV
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. A new upload key was generated for this run. Save it NOW as secrets (download the 'android-upload-key' artifact): ANDROID_KEYSTORE_BASE64 = contents of upload.jks.b64, ANDROID_KEYSTORE_PASSWORD = ANDROID_KEY_PASSWORD = the password in password.txt, ANDROID_KEY_ALIAS = facecouture"
            base64 -w0 upload.jks > upload.jks.b64; echo "$PASS" > password.txt
          fi
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE != 'true'
        with: { name: android-upload-key, path: "upload.jks.b64\npassword.txt", retention-days: 3 }
      - name: Signed release bundle (.aab)
        run: |
          cd android
          cat >> app/build.gradle <<EOF
          android { signingConfigs { release { storeFile file("${{ github.workspace }}/upload.jks"); storePassword "$PASS"; keyAlias "$ALIAS"; keyPassword "$KPASS" } }
                    buildTypes { release { signingConfig signingConfigs.release } } }
          EOF
          ./gradlew bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with: { name: face-couture-android-release, path: "android/app/build/outputs/bundle/release/*.aab\nandroid/app/build/outputs/apk/release/*.apk" }
      - name: Upload to Google Play
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.facecouture.studio
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.android_track }}
          status: completed
  ios:
    permissions:
      contents: write
    # Intel Macs: GitHub's Apple-chip Macs often have no capacity
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      # either naming works (APPSTORE_* from the README, or ASC_*)
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.APPSTORE_ISSUER_ID || secrets.ASC_ISSUER_ID }}
      KEY_P8: ${{ secrets.APPSTORE_PRIVATE_KEY || secrets.ASC_KEY_P8 }}
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1); sudo xcode-select -s "$X"; xcodebuild -version
      - run: npm install $DEPS
      - run: npm install @capacitor-community/in-app-review@latest || true
      - run: npm run build:web
        env: { FC_API_URL: '${{ vars.FC_API_URL }}', FC_RC_IOS: '${{ vars.FC_RC_IOS }}', FC_RC_ANDROID: '${{ vars.FC_RC_ANDROID }}', FC_SUPPORT_EMAIL: '${{ vars.FC_SUPPORT_EMAIL }}', APP_VERSION: '${{ env.VERSION }}' }
      - run: npx cap add ios && bash scripts/native-setup.sh ios && npx cap sync ios
        env: { APP_VERSION: '${{ env.VERSION }}', BUILD_NUMBER: '${{ github.run_number }}' }
      - name: Check the Apple secrets
        run: |
          miss=""; [ -n "$KEY_ID" ] || miss="$miss APPSTORE_KEY_ID"; [ -n "$ISSUER" ] || miss="$miss APPSTORE_ISSUER_ID"
          [ -n "$KEY_P8" ] || miss="$miss APPSTORE_PRIVATE_KEY"; [ -n "$TEAM" ] || miss="$miss APPLE_TEAM_ID"
          if [ -n "$miss" ]; then echo "::error::Missing GitHub secrets:$miss (see README.md)"; exit 1; fi
      - name: Build, then sign with Apple cloud signing at upload (no certificate files) and send to TestFlight
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"; printf '%s\n' "$KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -60 "$RUNNER_TEMP/archive.log"; exit 65; }
          tail -15 "$RUNNER_TEMP/archive.log"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string><key>destination</key><string>upload</string><key>signingStyle</key><string>automatic</string>
          <key>teamID</key><string>$TEAM</string><key>manageAppVersionAndBuildNumber</key><false/><key>uploadSymbols</key><true/></dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/out" $AUTH > "$RUNNER_TEMP/export.log" 2>&1 || { tail -60 "$RUNNER_TEMP/export.log"; exit 65; }
          tail -15 "$RUNNER_TEMP/export.log"
          rm -f "$KEY"
          echo "::notice::Build ${{ github.run_number }} uploaded. It appears in TestFlight once Apple finishes processing (usually 10-30 minutes)."
      - name: Publish the signing log for review (errors only, no secrets)
        if: always()
        run: |
          mkdir -p /tmp/out
          for f in archive export; do L="$RUNNER_TEMP/$f.log"; [ -f "$L" ] || continue
            { grep -n -E 'error|Error|failed|Failed|No profiles|No Account|provisioning|signing|certificate|ITMS|warning: ' "$L" | grep -v -i 'note:' | tail -80; echo '--- last lines ---'; tail -40 "$L"; } | sed -E 's/[A-Za-z0-9+\/=]{60,}/[redacted]/g' > /tmp/out/$f-log.txt; done
          ls /tmp/out | grep -q . || echo "no xcodebuild log (failed earlier)" > /tmp/out/none.txt
          git config user.name face-couture-ci; git config user.email hello@facecouture.app
          git checkout --orphan ci-release-log; git rm -rfq --cached . ; rm -rf out; mkdir out; cp /tmp/out/* out/
          git add -f out; git commit -qm "iOS release log, run ${{ github.run_number }}"; git push -qf origin HEAD:ci-output
