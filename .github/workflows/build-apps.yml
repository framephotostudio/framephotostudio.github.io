name: Build Face Couture apps
on:
  push:
    branches: [mobile-app]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/ios@latest @capacitor/splash-screen@latest @capacitor/status-bar@latest @capacitor/share@latest @capacitor/filesystem@latest @capacitor/haptics@latest @capacitor/app@latest @capacitor/network@latest @capacitor/preferences@latest @capacitor/browser@latest @revenuecat/purchases-capacitor@latest
      - name: Store review prompt plugin (optional)
        run: npm install @capacitor-community/in-app-review@latest || echo 'review plugin skipped'
      - run: npm run build:web
        env: { FC_API_URL: '${{ vars.FC_API_URL }}', FC_RC_IOS: '${{ vars.FC_RC_IOS }}', FC_RC_ANDROID: '${{ vars.FC_RC_ANDROID }}', FC_SUPPORT_EMAIL: '${{ vars.FC_SUPPORT_EMAIL }}', APP_VERSION: '1.0.0' }
      - run: npx cap add android
      - run: bash scripts/native-setup.sh android
        env: { APP_VERSION: '1.0.0', BUILD_NUMBER: '${{ github.run_number }}' }
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: face-couture-android-test, path: android/app/build/outputs/apk/debug/*.apk }
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/ios@latest @capacitor/splash-screen@latest @capacitor/status-bar@latest @capacitor/share@latest @capacitor/filesystem@latest @capacitor/haptics@latest @capacitor/app@latest @capacitor/network@latest @capacitor/preferences@latest @capacitor/browser@latest @revenuecat/purchases-capacitor@latest
      - name: Store review prompt plugin (optional)
        run: npm install @capacitor-community/in-app-review@latest || echo 'review plugin skipped'
      - run: npm run build:web
        env: { FC_API_URL: '${{ vars.FC_API_URL }}', FC_RC_IOS: '${{ vars.FC_RC_IOS }}', FC_RC_ANDROID: '${{ vars.FC_RC_ANDROID }}', FC_SUPPORT_EMAIL: '${{ vars.FC_SUPPORT_EMAIL }}', APP_VERSION: '1.0.0' }
      - run: npx cap add ios
      - run: bash scripts/native-setup.sh ios
        env: { APP_VERSION: '1.0.0', BUILD_NUMBER: '${{ github.run_number }}' }
      - run: npx cap sync ios
      - name: Build for iPhone simulator (no signing yet)
        run: |
          set -o pipefail
          cd ios/App
          ls
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -60
          ls build/Build/Products/Debug-iphonesimulator/
