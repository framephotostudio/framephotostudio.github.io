name: Build Face Couture apps
on:
  push:
    branches: [mobile-app, appstore-fix]
    paths-ignore: ['backend/**', 'private-test/**', 'release/**', '.github/workflows/backend.yml', '.github/workflows/private-ai-test.yml', '.github/workflows/ai-error.yml', '.github/workflows/vendor-copy.yml', 'store/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/ios@8 @capacitor/splash-screen@8.0.2 @capacitor/status-bar@8.0.4 @capacitor/share@8.0.3 @capacitor/filesystem@8.1.5 @capacitor/haptics@8.0.2 @capacitor/app@8.1.2 @capacitor/network@8.0.1 @capacitor/preferences@8.0.1 @capacitor/browser@8.0.5 @capacitor/camera@8.2.6
      - name: Store review prompt plugin (optional)
        run: |
          npm install @capacitor-community/in-app-review@8.0.0 || echo 'review plugin skipped'
          npm install @capacitor-community/media@9.1.0
      - run: npm run build:web
        env: { FC_API_URL: '${{ vars.FC_API_URL }}', FC_SUPPORT_EMAIL: '${{ vars.FC_SUPPORT_EMAIL }}', APP_VERSION: '1.0.0' }
      - run: npx cap add android
      - run: bash scripts/native-setup.sh android
        env: { APP_VERSION: '1.0.0', BUILD_NUMBER: '${{ github.run_number }}' }
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: face-couture-android-test, path: android/app/build/outputs/apk/debug/*.apk }
  ios:
    # Intel Macs: GitHub's Apple-chip Macs often have no capacity
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1); sudo xcode-select -s "$X"; xcodebuild -version
      - run: npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/ios@8 @capacitor/splash-screen@8.0.2 @capacitor/status-bar@8.0.4 @capacitor/share@8.0.3 @capacitor/filesystem@8.1.5 @capacitor/haptics@8.0.2 @capacitor/app@8.1.2 @capacitor/network@8.0.1 @capacitor/preferences@8.0.1 @capacitor/browser@8.0.5 @capacitor/camera@8.2.6
      - name: Store review prompt plugin (optional)
        run: |
          npm install @capacitor-community/in-app-review@8.0.0 || echo 'review plugin skipped'
          npm install @capacitor-community/media@9.1.0
      - run: npm run build:web
        env: { FC_API_URL: '${{ vars.FC_API_URL }}', FC_SUPPORT_EMAIL: '${{ vars.FC_SUPPORT_EMAIL }}', APP_VERSION: '1.0.0' }
      - run: npx cap add ios
      - run: bash scripts/native-setup.sh ios
        env: { APP_VERSION: '1.0.0', BUILD_NUMBER: '${{ github.run_number }}' }
      - run: npx cap sync ios
      - name: Build for iPhone simulator (no signing yet)
        run: |
          set -o pipefail
          cd ios/App
          ls
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -60
          ls build/Build/Products/Debug-iphonesimulator/
      - name: Open it on a simulated iPhone and take screenshots
        run: |
          DEV=$(xcrun simctl list devices available | grep -E 'iPhone 1[5-9]|iPhone 2[0-9]' | grep -v -i 'plus\|max\|mini\|SE\|air' | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulator $DEV"; xcrun simctl boot "$DEV" || true; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEV" app.facecouture.studio
          mkdir -p shots; for t in 10 25 45 75; do sleep $((t - ${prev:-0})); prev=$t; xcrun simctl io "$DEV" screenshot shots/ios-${t}s.png; done
          xcrun simctl spawn "$DEV" log show --last 3m --style compact --predicate 'process == "App"' > shots/app-log.txt 2>&1 || true
          tail -c 60000 shots/app-log.txt > shots/app-log-tail.txt || true
      - name: Publish screenshots to the ci-output branch for review
        if: always()
        run: |
          mkdir -p /tmp/out; cp shots/*.png shots/app-log-tail.txt /tmp/out/ 2>/dev/null || echo none > /tmp/out/none.txt
          git config user.name face-couture-ci; git config user.email hello@facecouture.app
          git checkout --orphan ci-shots; git rm -rfq --cached . ; rm -rf out; mkdir out; cp /tmp/out/* out/
          git add -f out; git commit -qm "iOS simulator screenshots, run ${{ github.run_number }}"; git push -qf origin HEAD:ci-output
