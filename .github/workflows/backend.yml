name: Deploy AI server
# Deploys backend/ to Cloudflare Workers, sets its secrets from GitHub, then runs a live test on the sample portrait.
on:
  workflow_dispatch:
  push:
    branches: [mobile-app]
    paths: ['backend/**', '.github/workflows/backend.yml']
permissions:
  contents: write
concurrency: { group: backend, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install wrangler
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: workers.dev address
        id: sub
        run: |
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $API | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            for c in facecouture facecouture-app face-couture-luxe; do
              R=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d "{\"subdomain\":\"$c\"}" $API)
              echo "$R" | jq -c '{success,errors}'
              if [ "$(echo "$R" | jq -r .success)" = "true" ]; then SUB=$c; break; fi
            done
          fi
          echo "subdomain: $SUB"; echo "sub=$SUB" >> $GITHUB_OUTPUT
      - name: Storage (KV)
        working-directory: backend
        run: |
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          L=$(curl -s -H "$H" "$API?per_page=100"); echo "$L" | jq -c '[.result[]?|{title,id}]'
          ID=$(echo "$L" | jq -r '[.result[]? | select(.title=="face-couture-kv" or .title=="face-couture-api-KV" or .title=="KV")][0].id // empty')
          if [ -z "$ID" ]; then ID=$(curl -s -X POST -H "$H" -H 'content-type: application/json' -d '{"title":"face-couture-kv"}' $API | jq -r '.result.id // empty'); fi
          echo "KV id: $ID"; test -n "$ID"
          sed -i "s/REPLACE_WITH_KV_ID/$ID/" wrangler.toml
      - name: Deploy
        working-directory: backend
        run: |
          set -o pipefail
          node --check src/prompts.js && node --check src/index.js
          npx wrangler deploy 2>&1 | tail -20
      - name: Secrets
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_PASSPHRASE: ${{ secrets.ADMIN_PASSPHRASE }}
        run: |
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY >/dev/null
          printf '%s' "$ADMIN_PASSPHRASE" | npx wrangler secret put ADMIN_PASSPHRASE >/dev/null
          printf '%s' "$(printf '%s' "$ADMIN_PASSPHRASE$CLOUDFLARE_ACCOUNT_ID fc-device-sign" | sha256sum | cut -c1-48)" | npx wrangler secret put APP_SIGNING_SECRET >/dev/null
          echo "secrets set"
      - name: Live test on the sample portrait
        env: { SUB: '${{ steps.sub.outputs.sub }}' }
        run: |
          U=https://face-couture-api.$SUB.workers.dev; echo "$U" > /tmp/url.txt; mkdir -p /tmp/out; echo "$U" > /tmp/out/url.txt
          for i in $(seq 1 30); do C=$(curl -s -o /tmp/out/status.json -w '%{http_code}' $U/api/status || true); echo "try $i: $C"; [ "$C" = "200" ] && break; sleep 10; done
          cat /tmp/out/status.json; echo
          curl -sS -o /dev/null -w 'final %{http_code}\n' $U/api/status 2>&1 | tee /tmp/out/reach.txt || true
          python3 - <<'PY'
          import re
          s=open('site/index.html',encoding='utf-8').read()
          open('/tmp/sample.txt','w').write(re.search(r"demoImage\.src='(data:image/jpeg;base64,[^']+)'",s).group(1))
          open('/tmp/man.txt','w').write(re.search(r"const MAN_PHOTO='(data:image/jpeg;base64,[^']+)'",s).group(1))
          PY
          run(){ # task name extra-json
            T=$(curl -s -X POST -H 'content-type: application/json' -H 'origin: https://facecouture.app' $U/api/hello -d '{"platform":"web"}' | jq -r .token)
            jq -n --rawfile img ${4:-/tmp/sample.txt} --arg task "$1" --argjson extra "$3" '{task:$task,image:($img|rtrimstr("\n")),consent:true,width:1024,height:1536}+$extra' > /tmp/req.json
            curl -s -X POST -H 'content-type: application/json' -H "authorization: Bearer $T" -H 'origin: https://facecouture.app' $U/api/ai --data @/tmp/req.json > /tmp/res.json
            jq -c 'del(.image)' /tmp/res.json | tee /tmp/out/$2.json
            jq -r '.image // empty' /tmp/res.json | sed 's/^data:[^,]*,//' | base64 -d > /tmp/out/$2.png 2>/dev/null || true
          }
          # sample generations only when asked (they use AI credit): put "test" in backend/.live-test
          if grep -q test .live-test 2>/dev/null || grep -q test backend/.live-test 2>/dev/null; then
            run glam glam-soft '{"intensity":"soft"}'
            run glam glam-glam '{"intensity":"glam"}'
            run glam glam-max '{"intensity":"max"}'
          fi
          A=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces
          KID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$A?per_page=100" | jq -r '[.result[]|select(.title=="face-couture-kv" or .title=="face-couture-api-KV" or .title=="KV")][0].id')
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$A/$KID/values/alert:last_provider_error" > /tmp/out/last-error.txt || true
          ls -la /tmp/out
      - name: Publish test results for review
        if: always()
        run: |
          cp site/index.html /tmp/keep.html 2>/dev/null || true
          git config user.name face-couture-ci; git config user.email hello@facecouture.app
          git checkout --orphan ci-ai; git rm -rfq --cached . ; rm -rf out; mkdir out; cp /tmp/out/* out/ 2>/dev/null || echo none > out/none.txt
          git add -f out; git commit -qm "AI server live test, run ${{ github.run_number }}"; git push -qf origin HEAD:ci-ai
