name: Subscription screens test (simulators only)
# Runs only on the "subscriptions" test branch. Builds a TEST app with a simulated server and store
# (nothing is charged, no real AI look is made), opens it on an iPhone simulator and an Android emulator,
# and saves screenshots to the ci-plan-shots branch. It never publishes anything to the stores or the website.
on:
  push:
    branches: [subscriptions]
    paths: ['app/**', 'scripts/**', '.github/workflows/plan-sim-test.yml']
permissions: { contents: write }
concurrency: { group: plan-sim, cancel-in-progress: true }
env:
  DEPS: "@capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/ios@latest @capacitor/splash-screen@latest @capacitor/status-bar@latest @capacitor/share@latest @capacitor/filesystem@latest @capacitor/haptics@latest @capacitor/app@latest @capacitor/network@latest @capacitor/preferences@latest @capacitor/browser@latest @revenuecat/purchases-capacitor@latest"
jobs:
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: subscriptions-site, path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Use the newest Xcode
        run: X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1); sudo xcode-select -s "$X"; xcodebuild -version
      - run: npm install $DEPS
      - name: Sample face for the test (AI-generated person, not a real customer; not saved in the repo)
        run: curl -sSL -A 'Mozilla/5.0' -o /tmp/face.jpg https://thispersondoesnotexist.com/ || true; ls -la /tmp/face.jpg || true
      - run: npm run build:web
        env: { FC_PLAN_DEMO: '1', DEMO_PHOTO: /tmp/face.jpg, APP_VERSION: '1.0.0' }
      - run: npx cap add ios && bash scripts/native-setup.sh ios && npx cap sync ios
        env: { APP_VERSION: '1.0.0', BUILD_NUMBER: '${{ github.run_number }}' }
      - name: Build for iPhone simulator
        run: |
          set -o pipefail; cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Run the walk-through on a simulated iPhone
        run: |
          DEV=$(xcrun simctl list devices available | grep -E 'iPhone 1[5-9]|iPhone 2[0-9]' | grep -v -i 'plus\|max\|mini\|SE\|air' | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$DEV" || true; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEV" app.facecouture.studio
          mkdir -p shots; for i in $(seq -w 1 26); do sleep 5; xcrun simctl io "$DEV" screenshot shots/ios-$i.png >/dev/null 2>&1; done
          xcrun simctl spawn "$DEV" log show --last 4m --style compact --predicate 'process == "App"' 2>/dev/null | grep -i 'plandemo\|error' | tail -80 > shots/ios-log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-plan-shots, path: shots }
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: subscriptions-site, path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install $DEPS
      - run: curl -sSL -A 'Mozilla/5.0' -o /tmp/face.jpg https://thispersondoesnotexist.com/ || true
      - run: npm run build:web
        env: { FC_PLAN_DEMO: '1', DEMO_PHOTO: /tmp/face.jpg, APP_VERSION: '1.0.0' }
      - run: npx cap add android && bash scripts/native-setup.sh android && npx cap sync android && cd android && ./gradlew assembleDebug
        env: { APP_VERSION: '1.0.0', BUILD_NUMBER: '${{ github.run_number }}' }
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
      - name: Write the walk-through script
        run: |
          cat > /tmp/walk.sh <<'EOF'
          set -x
          adb install -r android/app/build/outputs/apk/debug/*.apk
          adb logcat -c
          adb shell monkey -p app.facecouture.studio -c android.intent.category.LAUNCHER 1
          mkdir -p shots
          for i in $(seq -w 1 26); do sleep 5; adb exec-out screencap -p > shots/android-$i.png; done
          adb logcat -d | grep -i 'plandemo\|Console\|chromium' | tail -120 > shots/android-log.txt || true
          EOF
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash /tmp/walk.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-plan-shots, path: shots }
