name = "face-couture-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Secrets (set with `npx wrangler secret put NAME`, never in this file):
#   OPENAI_API_KEY      image model for AI Glam, backgrounds, headshots, Vanish, outfit try-on
#   ADMIN_PASSPHRASE    owner login for /admin
#   APP_SIGNING_SECRET  signs device tokens (any long random string)
#   REVENUECAT_WEBHOOK_SECRET   (optional) shared secret for subscription webhooks
#   RESEND_API_KEY      (optional) email alerts when spending nears the ceiling

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"          # created by: npx wrangler kv namespace create KV

[vars]
OWNER_EMAIL = "dedeyou1@gmail.com"
ALLOWED_ORIGINS = "https://facecouture.app,https://www.facecouture.app,capacitor://localhost,http://localhost,ionic://localhost"
IMAGE_MODEL = "gpt-image-1"
# cost assumptions used for the dashboard (USD per generation, by quality)
COST_PER_GEN_MEDIUM = "0.04"
COST_PER_GEN_HIGH = "0.17"
